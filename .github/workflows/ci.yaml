name: Build

on:
  push:
    branches: []
  pull_request:
    branches: []

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  all:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    name: All

    strategy:
      matrix:
        target:
        - x86_64-unknown-linux-gnu
        include:
        - target: x86_64-unknown-linux-gnu
          os:     ubuntu-latest

    runs-on: ${{matrix.os}}

    env:
      RUSTFLAGS: "-D warnings"

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        components: clippy

    - name: Info
      run: |
        rustup --version
        cargo --version
        cargo clippy --version

    - name: Apt Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ gcc git make meson nasm ninja-build

    - name: Build (Debug)
      run: |
        cargo build --target ${{ matrix.target }}

    - name: Build (Release)
      run: |
        cargo build --release --target ${{ matrix.target }}

    - name: Clippy
      run: |
        cargo clippy --release --target ${{ matrix.target }}

    - name: Test (Debug)
      run: |
        cargo test --target ${{ matrix.target }}

    - name: Test (Release)
      run: |
        cargo test --release --target ${{ matrix.target }}

    - name: loose.chk (Release)
      run: |
        cd skel && ../target/x86_64-unknown-linux-gnu/release/pxsum -c loose.chk

    - name: loose-g.chk (Release)
      run: |
        cd skel && ../target/x86_64-unknown-linux-gnu/release/pxsum -c loose-g.chk

    - name: strict.chk (Release)
      run: |
        cd skel && ../target/x86_64-unknown-linux-gnu/release/pxsum -c strict.chk

    - name: strict-g.chk (Release)
      run: |
        cd skel && ../target/x86_64-unknown-linux-gnu/release/pxsum -c strict-g.chk

    - name: Build (Vendored)
      run: |
        mkdir .cargo
        cargo vendor --locked > .cargo/config.toml
        cargo clean
        cargo build --locked --offline --target ${{ matrix.target }}
